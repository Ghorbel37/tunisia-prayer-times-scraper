name: Yearly prayer times

on:
  schedule:
    # Every year on 1 January at 03:00 UTC
    - cron: "0 3 1 1 *"
  workflow_dispatch:
    inputs:
      year:
        description: "Year to scrape (empty = current year)"
        required: false
      delay:
        description: "Average seconds between requests (each wait varies randomly around it)"
        required: false
        default: "1"
      zone:
        description: "Zones to scrape, separated by spaces or commas, e.g. tunis or tunis/carthage, sousse, or all"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick the year and zones
        env:
          YEAR: ${{ inputs.year }}
          ZONE: ${{ inputs.zone }}
          DELAY: ${{ inputs.delay }}
        run: |
          echo "YEAR=${YEAR:-$(date -u +%Y)}" >> "$GITHUB_ENV"
          echo "ZONE=${ZONE:-all}" >> "$GITHUB_ENV"
          echo "DELAY=${DELAY:-1}" >> "$GITHUB_ENV"

      - name: Scrape the year
        run: python scrape_prayer.py --zone "$ZONE" --year "$YEAR" --delay "$DELAY"

      - name: Move the README links to the new year
        if: ${{ !cancelled() }}
        run: |
          # Only for the current year; the script leaves the README alone if any linked file is missing
          if [ "$YEAR" = "$(date -u +%Y)" ]; then
            python .github/scripts/update_readme.py "$YEAR"
          fi

      - name: Commit the CSVs
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Ghorbel37"
          git config user.email "44169654+Ghorbel37@users.noreply.github.com"
          git add -f data/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            ZONES=$(python -c 'import sys, scrape_prayer; print(scrape_prayer.describe_zones(sys.argv[1]))' "$ZONE")
            git commit -m "Add prayer times for $ZONES $YEAR"
            git pull --rebase
            git push
          fi

      - name: Publish the year as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only once every governorate has a file for this year; a re-run replaces the files
          FILES=$(python -c 'import sys, scrape_prayer; print(" ".join(scrape_prayer.year_files(sys.argv[1]) or []))' "$YEAR")
          if [ -z "$FILES" ]; then
            echo "Not every governorate has a $YEAR file yet, so no release."
            exit 0
          fi
          ZIP="prayer_times_tunisia_$YEAR.zip"
          zip -j "$ZIP" $FILES
          if gh release view "$YEAR" > /dev/null 2>&1; then
            gh release upload "$YEAR" "$ZIP" $FILES --clobber
          else
            gh release create "$YEAR" "$ZIP" $FILES --target main --title "Prayer times $YEAR" \
              --notes "Prayer times for $YEAR for the main city of all 24 Tunisian governorates, scraped from meteo.tn. The zip holds all 24 files; each CSV has the columns DATE, FAJR, SUNRISE, DHUHR, ASR, MAGHRIB, ISHA."
          fi
